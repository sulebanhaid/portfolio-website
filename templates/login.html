{% extends "base.html" %}

{% block title %}
Login - BCE
{% endblock %}

{% block content %}

<main>
    <h1>Login</h1>

    <form method="POST">
        <div>
            <label for="email">Email address</label>

            <input
                type="email"
                id="email"
                name="email"
                required
            >
        </div>

        <br>

        <div>
            <label for="password">Password</label>

            <input
                type="password"
                id="password"
                name="password"
                required
            >
        </div>

        <br>

        <button type="submit">
            Login
        </button>
    </form>

    <p>
        No account?
        <a href="{{ url_for('register') }}">Register here</a>
    </p>
</main>

{% endblock %}
